name: MLOps Pipeline

on:
  push:
    branches: [master] # Kiểm tra kỹ tên branch của bạn là 'master' hay 'main'
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:
  # JOB 1: Chạy unit tests trên dữ liệu giả lập
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install "setuptools<70.0.0"
          pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v

  # JOB 2: Huấn luyện mô hình thực tế và đẩy Model lên Cloud Storage
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install "setuptools<70.0.0"
          pip install -r requirements.txt
      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV
      - name: Pull data with DVC
        run: |
          dvc init --no-scm -f
          dvc remote add -d myremote gs://${{ secrets.CLOUD_BUCKET }}/dvc
          dvc remote modify myremote credentialpath /tmp/sa-key.json
          dvc pull
      - name: Train model
        run: |
          export MLFLOW_TRACKING_URI=sqlite:///mlflow.db
          python src/train.py
      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; print(json.load(open('outputs/metrics.json'))['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT
      - name: Upload model to Cloud Storage
        run: |
          python -c "from google.cloud import storage; client=storage.Client(); bucket=client.bucket('${{ secrets.CLOUD_BUCKET }}'); blob=bucket.blob('models/latest/model.pkl'); blob.upload_from_filename('models/model.pkl'); print('Upload Success')"

  # JOB 3: Kiểm tra chất lượng (Eval Gate)
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check accuracy threshold
        run: |
          ACC=${{ needs.train.outputs.accuracy }}
          python -c "if $ACC < 0.70: print(f'Accuracy too low: { $ACC }'); exit(1); else: print(f'Accuracy passed: { $ACC }')"

  # JOB 4: Triển khai lên VM nếu đạt yêu cầu
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - name: Restart service via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            sleep 5
            curl -s http://localhost:8000/health | grep "ok"